<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyNow — Flights</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
:root { --ink:#1a2238; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bg:#f8fafc; }
* { box-sizing:border-box; }
body { font-family:system-ui,-apple-system,sans-serif; color:var(--ink); background:var(--bg); margin:0; padding:24px; max-width:880px; margin-inline:auto; }
header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:20px; }
h1 { font-size:22px; margin:0; }
h2 { font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:24px 0 8px; }
.badge-webmcp { font-size:12px; padding:4px 10px; border-radius:999px; background:#eef2ff; color:#4338ca; }
.badge-webmcp.off { background:#fee2e2; color:#b91c1c; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
@media (max-width:720px){ .grid { grid-template-columns:1fr; } }
form.search { display:grid; grid-template-columns:repeat(5,1fr) auto; gap:8px; }
form.search input { padding:8px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
.card { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fff; }
.card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.row { font-size:14px; margin-top:4px; }
.muted { color:var(--muted); }
.price { font-weight:700; color:var(--accent); }
.badge { font-size:11px; padding:2px 8px; border-radius:6px; background:#ecfdf5; color:#047857; }
.btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; }
.btn-ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); }
footer { margin-top:32px; font-size:12px; color:var(--muted); }
</style>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<header>
  <h1>✈ FlyNow</h1>
  <span class="badge-webmcp" id="webmcp-badge">WebMCP: detecting…</span>
</header>

<section>
  <h2>Search flights</h2>
  <form class="search" hx-post="/search" hx-target="#results" hx-swap="innerHTML">
    <div class="ac">
      <input name="origin" id="origin" placeholder="From — e.g. LOS" autocomplete="off">
      <div class="ac-list" id="origin-list" style="display:none"></div>
    </div>
    <div class="ac">
      <input name="destination" id="destination" placeholder="To — e.g. CDG" autocomplete="off">
      <div class="ac-list" id="destination-list" style="display:none"></div>
    </div>
    <input name="departure_date" type="date" value="2026-09-15">
    <input name="return_date" type="date" value="2026-09-20">
    <input name="travelers" type="number" value="2" min="1">
    <button class="btn" type="submit">Search</button>
  </form>
  <div id="results" style="margin-top:12px;"></div>
</section>

<section>
  <details class="history">
    <summary>🕘 History <span class="muted">— your bookings (agents book here too)</span></summary>
    <div id="bookings" hx-get="/bookings" hx-trigger="load, every 2s" hx-swap="innerHTML"></div>
  </details>
</section>

<footer>FlyNow · independent WebMCP travel provider · human &amp; agent share one state</footer>

<script>
// WebMCP: expose FlyNow's capabilities to the Concierge agent.
(function () {
  const EXPOSED_ORIGINS = {{.ExposedOriginsJS}};

  async function post(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return { error: data.error || ('HTTP ' + res.status) };
    return data;
  }

  const tools = [
    {
      name: 'search_flights',
      title: 'Search flights',
      description: 'Search available round-trip flights between two airports on given dates. Returns flight options with id, airline, times, stops and total price.',
      inputSchema: {
        type: 'object',
        properties: {
          origin: { type: 'string', description: 'Origin airport code, e.g. LOS' },
          destination: { type: 'string', description: 'Destination airport code, e.g. CDG' },
          departure_date: { type: 'string', description: 'Outbound date, YYYY-MM-DD' },
          return_date: { type: 'string', description: 'Return date, YYYY-MM-DD' },
          travelers: { type: 'integer', description: 'Number of travelers' },
        },
        required: ['origin', 'destination', 'departure_date'],
      },
      annotations: { readOnlyHint: true },
      execute: async (input) => post('/api/search_flights', input),
    },
    {
      name: 'get_flight_details',
      title: 'Get flight details',
      description: 'Return full details for a single flight given its id.',
      inputSchema: {
        type: 'object',
        properties: { flight_id: { type: 'string' } },
        required: ['flight_id'],
      },
      annotations: { readOnlyHint: true },
      execute: async (input) => post('/api/get_flight_details', input),
    },
    {
      name: 'check_flight_availability',
      title: 'Check flight availability',
      description: 'Check whether a flight has seats available and get its current price.',
      inputSchema: {
        type: 'object',
        properties: { flight_id: { type: 'string' }, travelers: { type: 'integer' } },
        required: ['flight_id'],
      },
      annotations: { readOnlyHint: true },
      execute: async (input) => post('/api/check_flight_availability', input),
    },
    {
      name: 'hold_flight',
      title: 'Hold a flight',
      description: 'Place a short hold on a flight, returning a hold_id that can be used to complete a booking.',
      inputSchema: {
        type: 'object',
        properties: { flight_id: { type: 'string' } },
        required: ['flight_id'],
      },
      annotations: { readOnlyHint: false },
      execute: async (input) => post('/api/hold_flight', input),
    },
    {
      name: 'book_flight',
      title: 'Book a flight',
      description: 'Book a flight, optionally completing a hold. Associates the booking with a trip_id and returns the confirmed booking.',
      inputSchema: {
        type: 'object',
        properties: {
          flight_id: { type: 'string', description: 'Flight id from search results' },
          hold_id: { type: 'string', description: 'Optional hold id' },
          trip_id: { type: 'string', description: 'Trip id supplied by the orchestrating agent' },
          travelers: { type: 'integer' },
          passenger_name: { type: 'string' },
        },
        required: ['flight_id'],
      },
      annotations: { readOnlyHint: false },
      execute: async (input) => post('/api/book_flight', input),
    },
    {
      name: 'cancel_flight',
      title: 'Cancel a flight booking',
      description: 'Cancel an existing flight booking by booking_id.',
      inputSchema: {
        type: 'object',
        properties: { booking_id: { type: 'string' } },
        required: ['booking_id'],
      },
      annotations: { readOnlyHint: false },
      execute: async (input) => post('/api/cancel_flight', input),
    },
  ];

  async function register() {
    const badge = document.getElementById('webmcp-badge');
    if (!('modelContext' in document)) {
      badge.textContent = 'WebMCP: unavailable';
      badge.classList.add('off');
      return;
    }
    let ok = 0;
    for (const t of tools) {
      try {
        await document.modelContext.registerTool(t, { exposedTo: EXPOSED_ORIGINS });
        ok++;
      } catch (e) {
        console.warn('registerTool failed for', t.name, e);
      }
    }
    badge.textContent = 'WebMCP: ' + ok + '/' + tools.length + ' tools exposed';
    if (ok === 0) badge.classList.add('off');
  }

  register();
})();
</script>
<script>
function attachAirportAutocomplete(inputId, listId) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  let t = null;
  input.addEventListener('input', () => {
    clearTimeout(t);
    const q = input.value.trim();
    if (q.length < 1) { list.style.display = 'none'; return; }
    t = setTimeout(async () => {
      try {
        const r = await fetch('/api/airports?q=' + encodeURIComponent(q));
        const d = await r.json();
        list.innerHTML = '';
        for (const a of (d.airports || [])) {
          const el = document.createElement('div');
          el.className = 'ac-item';
          el.innerHTML = `<span>${a.code} — ${a.city}, ${a.country}</span>`;
          el.onmousedown = (e) => { e.preventDefault(); input.value = a.code; list.style.display = 'none'; };
          list.appendChild(el);
        }
        list.style.display = (d.airports && d.airports.length) ? 'block' : 'none';
      } catch (e) { list.style.display = 'none'; }
    }, 200);
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.ac')) list.style.display = 'none'; });
}
attachAirportAutocomplete('origin', 'origin-list');
attachAirportAutocomplete('destination', 'destination-list');
</script>
</body>
</html>
